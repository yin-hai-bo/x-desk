[package]
name = "x-desk"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/*",
    "sub-apps/x-desk-main-ui/src-tauri",
    "sub-apps/x-desk-player",
    "sub-apps/x-desk-webview",
]

[workspace.dependencies]
anyhow = "1.0.104"
common = { path = "crates/common" }
config = { path = "crates/config" }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
single-instance = { path = "crates/single-instance" }
toml = "0.8.23"
wnd = { path = "crates/wnd" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
config = { workspace = true }
log = { workspace = true }
single-instance = { workspace = true }
wnd = { workspace = true }
windows = { workspace = true }


[build-dependencies]
embed-resource = "2.5"
